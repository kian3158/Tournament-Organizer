[tool.poetry]
name = "tournament-organizer-backend"
version = "0.1.0"
description = "Backend for tournament organizer app"
authors = ["kian3158"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
websockets = "^13.0"
sqlalchemy = "^2.0.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.11"
pyjwt = "^2.9.0"
bcrypt = "^4.2.0"
email-validator = "^2.2.0"

[tool.poetry.dev-dependencies]
black = "^24.3.0"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"

[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
exclude = ["alembic", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]